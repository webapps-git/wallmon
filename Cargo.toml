[package]
name = "wallmon"
version = "0.1.0"
edition = "2024"
description = "Always-on server status board for a monitor in the server room"
license = "MIT"

[dependencies]
chrono = "0.4.45"
libc = "0.2"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt", "time", "signal", "macros"] }
toml = "1.1.8"
serde_json = "1.0.154"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
